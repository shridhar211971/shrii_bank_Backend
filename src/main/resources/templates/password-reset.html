<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Password Reset</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container{
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2{
            color: #c62828;
        }

        p{
            color: #333;
        }

        .button{
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #1556c0;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .footer{
            margin-top: 30px;
            font-size: 13px;
            color: #555;
        }
		.code-box{
		    margin: 25px auto;
		    padding: 15px 25px;
		    width: fit-content;
		    background: #f1f5ff;
		    border: 2px dashed #1556c0;
		    border-radius: 10px;
		    font-size: 28px;
		    font-weight: bold;
		    letter-spacing: 6px;
		    color: #1556c0;
		}

    </style>

</head>

<body>

<div class="container">

    <h2>Password Reset Request</h2>

    <p>
        Hello
        <span th:text="${name}">User</span>,
    </p>

	<p>
	    We received a request to reset your password.
	    Please use the verification code below:
	</p>

	<div class="code-box">
	    <span th:text="${code}">ABCDE</span>
	</div>

	<p>
	    This code will expire in 5 hours.
	</p>

    <p>
        If you did not request this,
        please ignore this email.
    </p>

    <div class="footer">
        © 2026 Shrii Bank | Security First
    </div>

</div>

</body>

</html>
